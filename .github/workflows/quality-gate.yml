name: Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install project generator
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Verify engine, apps, UI, releases, and analyzers
        env:
          CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: ./scripts/ci-verify.sh

      - name: Preserve diagnostic results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VideoNotes-xcresults-${{ github.run_attempt }}
          path: /tmp/VideoNotes-ci-${{ github.run_id }}-${{ github.run_attempt }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 14
